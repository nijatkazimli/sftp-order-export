version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Majors that the Shopify packages don't support yet; move them deliberately, together.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
      # v7 adds React Compiler rules that flag existing code; adopt deliberately.
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
    groups:
      # These must move together; react-router and its packages are pinned to one version.
      react-router:
        patterns: ["react-router", "@react-router/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      shopify:
        patterns: ["@shopify/*"]
      dev-tools:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    # Odd-numbered Node releases aren't LTS; change the Node major by hand (CI and Dockerfile together).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
