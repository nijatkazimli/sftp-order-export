services:
  - type: web
    name: sftp-order-export
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sftp-order-export-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders
      # 32 random bytes as 64 hex chars: openssl rand -hex 32
      - key: ENCRYPTION_KEY
        sync: false
      # Shown on the public /privacy and /terms pages.
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: HOSTING_REGION
        sync: false
      - key: GOVERNING_LAW
        sync: false

databases:
  - name: sftp-order-export-db
    plan: 0.1c-256mb
    ipAllowList: []
